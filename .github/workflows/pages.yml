name: Deploy RWA.MS Pages

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/public/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned TradingView Lightweight Charts
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Vendor TradingView Lightweight Charts
        run: npm run vendor:charts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
