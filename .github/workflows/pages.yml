name: Deploy RWA.MS Pages

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/public/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned TradingView Lightweight Charts
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Vendor TradingView Lightweight Charts
        run: npm run vendor:charts
      - name: Capture real Hyperliquid deployment snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/public/data
          API="https://api.hyperliquid.xyz/info"
          HDR="content-type: application/json"
          curl -fsS --retry 3 --retry-delay 2 -H "$HDR" -d '{"type":"metaAndAssetCtxs"}' "$API" > apps/web/public/data/hyperliquid-meta.json
          NOW_MS=$(($(date +%s)*1000))
          START_CANDLES=$((NOW_MS-648000000))
          START_FUNDING=$((NOW_MS-86400000))
          curl -fsS --retry 3 --retry-delay 2 -H "$HDR" -d "{\"type\":\"candleSnapshot\",\"req\":{\"coin\":\"BTC\",\"interval\":\"1h\",\"startTime\":$START_CANDLES,\"endTime\":$NOW_MS}}" "$API" > apps/web/public/data/btc-candles-1h.json
          curl -fsS --retry 3 --retry-delay 2 -H "$HDR" -d '{"type":"l2Book","coin":"BTC","nSigFigs":5}' "$API" > apps/web/public/data/btc-book.json
          curl -fsS --retry 3 --retry-delay 2 -H "$HDR" -d "{\"type\":\"fundingHistory\",\"coin\":\"BTC\",\"startTime\":$START_FUNDING,\"endTime\":$NOW_MS}" "$API" > apps/web/public/data/btc-funding.json
          printf '{"capturedAt":%s,"source":"Hyperliquid Info API","defaultMarket":"BTC","interval":"1h"}\n' "$NOW_MS" > apps/web/public/data/snapshot-meta.json
          test -s apps/web/public/data/hyperliquid-meta.json
          test -s apps/web/public/data/btc-candles-1h.json
          test -s apps/web/public/data/btc-book.json
      - name: Render desktop and mobile visual verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-check
          python3 -m http.server 4173 --directory apps/web/public >/tmp/rwa-ms-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1920,1080 --virtual-time-budget=10000 --screenshot=visual-check/desktop-1920x1080.png http://127.0.0.1:4173/#market
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=390,844 --virtual-time-budget=10000 --screenshot=visual-check/mobile-390x844.png http://127.0.0.1:4173/#market
          test -s visual-check/desktop-1920x1080.png
          test -s visual-check/mobile-390x844.png
      - name: Upload visual verification
        uses: actions/upload-artifact@v4
        with:
          name: rwa-ms-visual-check
          path: visual-check
          retention-days: 2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
